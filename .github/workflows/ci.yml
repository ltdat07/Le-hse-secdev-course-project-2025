name: CI (course)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ hashFiles('pyproject.toml') }}-
            ${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort pytest pytest-cov

      - name: Lint
        run: |
          ruff check .
          black --check .
          isort --check-only .

      - name: Tests
        env:
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: |
          mkdir -p reports
          pytest -q \
            --cov=src/studynotes \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage-${{ matrix.python-version }}.xml \
            --cov-fail-under=80 \
            --junitxml=reports/junit-${{ matrix.python-version }}.xml

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.python-version }}
          path: reports/

  build-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (cached, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: studynotes:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mock deploy to stage
        env:
          IMAGE_TAG: studynotes:${{ github.sha }}
          STAGE_URL: ${{ vars.STAGE_URL }}
        run: |
          echo "Mock deploy ${IMAGE_TAG} to ${STAGE_URL:-<no-stage-url>}"