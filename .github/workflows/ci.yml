name: CI (course)

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint & tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # dev-инструменты
          pip install ruff black isort bandit pytest pytest-cov

      - name: Lint (ruff, black, isort)
        run: |
          ruff check .
          black --check .
          isort --check-only .

      - name: Security lint (bandit)
        run: bandit -r src -q

      - name: Tests with coverage & JUnit
        run: |
          mkdir -p reports
          pytest -q \
            --cov=src/studynotes \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=reports/junit-py${{ matrix.python-version }}.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: reports/

  docker-stage:
    name: Build Docker image (mock deploy)
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/studynotes
      APP_ENV: stage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Mock deploy to staging
        env:
          STAGE_URL: ${{ vars.STAGE_URL }}
        run: |
          echo "APP_ENV=$APP_ENV"
          echo "Built image: $IMAGE_NAME:${{ github.sha }}"
          echo "Would deploy to: ${STAGE_URL:-https://example-stage.local} (dry-run)"