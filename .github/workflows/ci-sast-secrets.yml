name: Security - SAST & Secrets

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.py"
      - "security/semgrep/**"
      - "security/.gitleaks.toml"
      - ".github/workflows/ci-sast-secrets.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast_secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SEMGREP_VERSION: "1.91.0"
      GITLEAKS_VERSION: "8.18.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P10

      - name: Semgrep CI (SARIF)
        run: |
          docker run --rm -v "$PWD:/src" returntocorp/semgrep:${SEMGREP_VERSION} \
            semgrep ci \
              --config p/ci \
              --config /src/security/semgrep/rules.yml \
              --sarif --output /src/EVIDENCE/P10/semgrep.sarif \
              --metrics=off || true

      - name: Gitleaks detect (secrets)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v${GITLEAKS_VERSION} \
            detect --no-banner \
              --config=/repo/security/.gitleaks.toml \
              --source=/repo \
              --report-format=json \
              --report-path=/repo/EVIDENCE/P10/gitleaks.json || true

      - name: Generate SAST summary
        run: |
          {
            echo "# SAST & Secrets summary for commit ${GITHUB_SHA}"
            echo
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Semgrep findings by level:"
            if [ -f EVIDENCE/P10/semgrep.sarif ]; then
              jq '[.runs[].results[].level]
                  | group_by(.)
                  | map({ (.[0]): length })
                  | add // {}' EVIDENCE/P10/semgrep.sarif || echo "{}"
            else
              echo "{}"
            fi
            echo
            echo "Gitleaks report: see EVIDENCE/P10/gitleaks.json"
          } > EVIDENCE/P10/sast_summary.md

      - name: Upload SAST & Secrets evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P10_EVIDENCE
          path: EVIDENCE/P10